<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Five Stars</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,#0f172a,#111827 55%,#1e293b);font-family:"Segoe UI",Tahoma,Arial,sans-serif;color:#fff;overflow:hidden}
.card{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center}
.logo{width:104px;height:104px;border-radius:28px;display:grid;place-items:center;background:linear-gradient(135deg,#f8fafc,#cbd5e1);box-shadow:0 18px 55px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.85);color:#0f172a;font-size:64px;font-weight:900}
h1{margin:2px 0 0;font-size:34px;letter-spacing:.2px}
p{margin:0;color:#cbd5e1;font-size:14px}
.progress{width:230px;height:5px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:8px}
.bar{height:100%;width:38%;border-radius:999px;background:#fff;animation:loading 1.1s ease-in-out infinite}
@keyframes loading{0%{transform:translateX(0);opacity:.3}50%{transform:translateX(150px);opacity:1}100%{transform:translateX(0);opacity:.3}}
.small{font-size:11px;color:#94a3b8;margin-top:2px}
</style>
</head>
<body>
  <div class="card">
    <div class="logo">★</div>
    <h1>Five Stars</h1>
    <p>نظام البيع والمخزن</p>
    <div class="progress"><div class="bar"></div></div>
    <div class="small">جاري تشغيل التطبيق…</div>
  </div>
</body>
</html>
