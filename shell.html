<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="application-name" content="Five Stars">
<title>Five Stars</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f8fafc}#appFrame{border:0;width:100%;height:100%;display:block;background:#fff}#syncStatus{position:fixed;left:14px;bottom:14px;z-index:99999;font:600 12px Arial,sans-serif;background:#0f172a;color:#fff;padding:8px 12px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.18);pointer-events:none}</style>
</head>
<body>
<div id="syncStatus">بدء المزامنة…</div>
<iframe id="appFrame" title="Five Stars"></iframe>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// First-run admin bootstrap: default password is 123456, then the user can change it from the app.
(function(){
  try {
    const flag='fs_admin_default_password_initialized_v1';
    if(!localStorage.getItem(flag)){
      let users=[];
      try { users=JSON.parse(localStorage.getItem('fs_users')||'[]')||[]; } catch(e) { users=[]; }
      if(!Array.isArray(users)) users=[];
      const admin=users.find(u=>String(u.name||'').toLowerCase()==='admin');
      if(admin) admin.pass='123456';
      else users.unshift({id:1,name:'admin',role:'مدير',pass:'123456'});
      localStorage.setItem('fs_users',JSON.stringify(users));
      localStorage.setItem(flag,'1');
    }
  } catch(e) { console.warn('[Five Stars Admin Bootstrap]',e); }
})();
</script>
<script src="shell-sync-v2.js"></script>
<script>
(async()=>{
  const frame=document.getElementById('appFrame'),status=document.getElementById('syncStatus');
  let reloading=false;
  window.FiveStarsShell={
    reloadApp(){if(reloading)return;reloading=true;frame.src='index.html?sync='+Date.now();setTimeout(()=>reloading=false,1200)},
    setStatus(t){status.textContent=t}
  };
  frame.src='index.html';
  if('serviceWorker' in navigator){try{await navigator.serviceWorker.register('sw.js',{scope:'./'})}catch(e){console.warn('[Five Stars SW]',e)}}
})();
</script>
</body>
</html>
