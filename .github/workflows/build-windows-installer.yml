name: Build Five Stars Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist-installer -Filter '*SETUP.exe' -ErrorAction SilentlyContinue
          if (-not $setup) {
            Write-Error 'Five Stars SETUP.exe was not generated.'
            exit 1
          }
          Get-ChildItem dist-installer | Format-Table Name,Length

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Five-Stars-Windows-Installer
          path: |
            dist-installer/*SETUP.exe
            dist-installer/*uninstaller.exe
          if-no-files-found: error
          retention-days: 30
