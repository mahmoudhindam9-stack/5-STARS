name: Build Five Stars Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Windows icon and installer artwork
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path electron, build | Out-Null
          magick electron/icon.svg -background none -define icon:auto-resize=256,128,64,48,32,16 electron/icon.ico
          magick build/installer-sidebar.svg -background '#0f172a' -alpha remove -alpha off -resize 164x314 BMP3:build/installerSidebar.bmp
          magick build/uninstaller-sidebar.svg -background '#111827' -alpha remove -alpha off -resize 164x314 BMP3:build/uninstallerSidebar.bmp

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer
        shell: pwsh
        run: |
          $setup = Get-ChildItem -Path dist-installer -Filter 'Five Stars SETUP.exe' -ErrorAction SilentlyContinue
          if (-not $setup) {
            Get-ChildItem dist-installer -ErrorAction SilentlyContinue | Format-Table Name,Length
            throw 'Five Stars SETUP.exe was not generated.'
          }
          $size = [math]::Round($setup.Length / 1MB, 2)
          Write-Host "Generated: $($setup.FullName)"
          Write-Host "Installer size: $size MB"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Five-Stars-SETUP-Windows-x64
          path: dist-installer/Five Stars SETUP.exe
          if-no-files-found: error
          retention-days: 30
