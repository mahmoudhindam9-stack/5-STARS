name: Restore Five Stars POS from Juba reference

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch POS UI and runtime
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1) Restore a Juba-like POS composition while keeping Five Stars domain.
          p = root / 'index.html'
          s = p.read_text(encoding='utf-8')
          old = re.search(r'<section id="pos" class="page">.*?</section>\n\n    <section id="inventory"', s, re.S)
          if not old:
              raise SystemExit('POS section not found')
          pos = r'''<section id="pos" class="page">
        <div class="pos-shell">
          <div class="pos-main">
            <div class="pos-header-card">
              <div class="pos-branding">
                <div class="pos-logo">★</div>
                <div><h2>Five Stars</h2><p>نقطة البيع — الأدوات الكهربائية</p></div>
              </div>
              <div class="pos-search-wrap">
                <span>⌕</span>
                <input id="posSearch" class="pos-search" placeholder="ابحث بالاسم أو الباركود...">
              </div>
              <button class="btn secondary pos-focus" onclick="focusBarcode()">ماسح الباركود</button>
            </div>

            <div class="pos-scanner-card">
              <div class="scanner-copy"><b>البيع بالباركود</b><span>قارئ USB / Bluetooth أو كاميرا الجهاز</span></div>
              <div class="scanner-actions">
                <input id="posBarcode" class="input pos-barcode" placeholder="امسح الباركود ثم Enter" autofocus>
                <button class="btn secondary" onclick="startCamera('pos')">📷 كاميرا</button>
              </div>
            </div>

            <div class="category-strip" id="posCategories">
              <button class="category-chip active" data-cat="all" onclick="setPosCategory('all')">كل الأصناف</button>
            </div>

            <div class="product-panel">
              <div class="product-panel-head"><div><h3>الأصناف</h3><span class="muted">اضغط على الصنف لإضافته للسلة</span></div><span id="posItemCount" class="badge">0 صنف</span></div>
              <div id="products" class="products pos-products"></div>
            </div>
          </div>

          <aside class="pos-cart-panel">
            <div class="pos-cart-head">
              <div class="cart-title"><div class="cart-bird">🕊️</div><div><h3>السلة</h3><span id="cartCount" class="badge">0 وحدة</span></div></div>
              <button class="btn secondary" onclick="clearCart()">تفريغ</button>
            </div>
            <div id="cart" class="pos-cart-lines"></div>

            <div class="cart-summary">
              <div class="summary-line"><span>المجموع الفرعي</span><b id="cartSubtotal">0.00 ج</b></div>
              <div class="summary-fields">
                <label>خصم<input id="cartDiscount" class="input" type="number" min="0" step="0.01" value="0"></label>
                <label>ضريبة %<input id="cartTax" class="input" type="number" min="0" step="0.01" value="0"></label>
              </div>
              <div class="summary-line total"><span>الإجمالي</span><strong id="cartTotal">0.00 ج</strong></div>
            </div>

            <div class="customer-box">
              <label>طريقة الدفع<select id="payment" class="input"><option value="نقدي">نقدي</option><option value="بطاقة">بطاقة</option><option value="آجل">آجل</option></select></label>
              <label>العميل<select id="customerSelect" class="input"><option value="">عميل نقدي</option></select></label>
            </div>

            <div class="pos-cart-actions">
              <button class="btn success full" onclick="checkout()">✓ إتمام البيع وطباعة</button>
              <div class="action-row"><button class="btn secondary grow" onclick="holdCart()">تعليق البيع</button><button class="btn secondary grow" onclick="restoreCart()">استرجاع</button></div>
              <div id="heldSales" class="held"></div>
            </div>
          </aside>
        </div>
      </section>

    <section id="inventory"'''
          s = s[:old.start()] + pos + s[old.end():]
          # Keep the page root valid after the replacement.
          s = s.replace('    <section id="inventory"    <section id="inventory"', '    <section id="inventory"')
          p.write_text(s, encoding='utf-8')

          # 2) Add robust POS rendering/search/category support to the existing runtime.
          p = root / 'app.js'
          s = p.read_text(encoding='utf-8')
          marker = 'function renderCart() {'
          if 'function renderProducts() {' not in s:
              insert = r'''
function getPosCategoryList() {
  return [...new Set(products.map(p => p.cat || 'عام'))].filter(Boolean).sort((a,b)=>a.localeCompare(b,'ar'));
}
function setPosCategory(cat) {
  window.__posCategory = cat || 'all';
  document.querySelectorAll('.category-chip').forEach(b => b.classList.toggle('active', b.dataset.cat === window.__posCategory));
  renderProducts();
}
function renderPosCategories() {
  const root = $('posCategories'); if (!root) return;
  const cats = getPosCategoryList();
  root.innerHTML = '<button class="category-chip active" data-cat="all" onclick="setPosCategory(\'all\')">كل الأصناف</button>' +
    cats.map(c => `<button class="category-chip" data-cat="${esc(c)}" onclick="setPosCategory('${String(c).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">${esc(c)}</button>`).join('');
  const active = window.__posCategory || 'all';
  root.querySelectorAll('.category-chip').forEach(b => b.classList.toggle('active', b.dataset.cat === active));
}
function renderProducts() {
  const root = $('products'); if (!root) return;
  const q = ($('posSearch')?.value || '').trim().toLowerCase();
  const cat = window.__posCategory || 'all';
  const list = products.filter(p => {
    const hay = `${p.name} ${p.barcode} ${p.cat || ''}`.toLowerCase();
    return (!q || hay.includes(q)) && (cat === 'all' || (p.cat || 'عام') === cat);
  });
  if ($('posItemCount')) $('posItemCount').textContent = `${list.length} صنف`;
  root.innerHTML = list.map(p => {
    const img = p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy">` : '<div class="product-placeholder">★</div>';
    return `<button class="product-card" onclick="addCart(${p.id})">${img}<div class="product-card-body"><div class="product-name">${esc(p.name)}</div><div class="product-meta"><span>${esc(p.cat || 'عام')}</span><b>${money(p.sell)}</b></div><div class="product-stock">المتاح: ${p.qty} ${esc(p.unit)}</div></div></button>`;
  }).join('') || '<div class="empty">لا توجد أصناف مطابقة للبحث</div>';
}
function saveProduct(){ addProduct(); }

'''
              s = s.replace(marker, insert + marker, 1)
          # Render categories whenever the POS data changes.
          s = s.replace('function renderAll(){\n  renderProducts(); renderCart();', 'function renderAll(){\n  renderPosCategories(); renderProducts(); renderCart();', 1)
          # Add image compatibility during product load/save without breaking old products.
          s = s.replace("    min: Math.max(0, +p.min || 0), unit: p.unit || 'قطعة', cat: p.cat || 'عام'\n", "    min: Math.max(0, +p.min || 0), unit: p.unit || 'قطعة', cat: p.cat || 'عام', image: p.image || ''\n", 1)
          s = s.replace("  const p={ id:Date.now(), name, barcode, buy:+$('pBuy').value||0, sell:+$('pSell').value||0, qty:Math.max(0,+$('pQty').value||0), min:Math.max(0,+$('pMin').value||0), unit:$('pUnit').value.trim()||'قطعة', cat:$('pCat').value.trim()||'عام' };", "  const p={ id:Date.now(), name, barcode, buy:+$('pBuy').value||0, sell:+$('pSell').value||0, qty:Math.max(0,+$('pQty').value||0), min:Math.max(0,+$('pMin').value||0), unit:$('pUnit').value.trim()||'قطعة', cat:$('pCat').value.trim()||'عام', image:$('pImage')?.value?.trim()||'' };")
          s = s.replace("['pName','pBarcode','pBuy','pSell','pQty','pMin','pUnit','pCat']", "['pName','pBarcode','pBuy','pSell','pQty','pMin','pUnit','pCat','pImage']")
          s = s.replace("Object.assign(p,{name:$('mName').value.trim(),barcode:b,buy:+$('mBuy').value||0,sell:+$('mSell').value||0,qty:Math.max(0,+$('mQty').value||0),min:Math.max(0,+$('mMin').value||0),unit:$('mUnit').value.trim()||'قطعة',cat:$('mCat').value.trim()||'عام'});", "Object.assign(p,{name:$('mName').value.trim(),barcode:b,buy:+$('mBuy').value||0,sell:+$('mSell').value||0,qty:Math.max(0,+$('mQty').value||0),min:Math.max(0,+$('mMin').value||0),unit:$('mUnit').value.trim()||'قطعة',cat:$('mCat').value.trim()||'عام'});")
          p.write_text(s, encoding='utf-8')

          # 3) Restore a Juba-style fixed cart, spacious product grid, and mobile behavior.
          p = root / 'styles.css'
          s = p.read_text(encoding='utf-8')
          css = r'''
/* Five Stars POS — visual baseline intentionally follows the mature Juba POS composition. */
.pos-shell{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:18px;min-height:calc(100vh - 130px)}
.pos-main{min-width:0}.pos-header-card{display:flex;align-items:center;gap:16px;background:linear-gradient(135deg,#0f172a,#1e293b);color:#fff;border-radius:22px;padding:18px 20px;box-shadow:0 18px 40px rgba(15,23,42,.13)}
.pos-branding{display:flex;align-items:center;gap:11px;min-width:205px}.pos-logo{width:48px;height:48px;border-radius:15px;background:#fff;color:#0f172a;display:grid;place-items:center;font-size:24px;font-weight:900}.pos-branding h2{margin:0;font-size:19px}.pos-branding p{margin:4px 0 0;font-size:11px;color:#cbd5e1}.pos-search-wrap{flex:1;position:relative}.pos-search-wrap>span{position:absolute;right:13px;top:50%;transform:translateY(-50%);font-size:20px;color:#cbd5e1}.pos-search{width:100%;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:15px;padding:13px 40px 13px 14px;color:#fff;outline:none}.pos-search::placeholder{color:#cbd5e1}.pos-search:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(147,197,253,.12)}
.pos-scanner-card{display:grid;grid-template-columns:1fr minmax(320px,1.5fr);gap:14px;align-items:center;background:#eff6ff;border:1px dashed #60a5fa;border-radius:16px;padding:13px 15px;margin-top:12px}.scanner-copy b{display:block;font-size:14px}.scanner-copy span{display:block;margin-top:4px;color:#64748b;font-size:11px}.scanner-actions{display:grid;grid-template-columns:1fr auto;gap:8px}.pos-barcode{font-size:15px;font-weight:700}.category-strip{display:flex;gap:8px;overflow:auto;padding:13px 2px 4px;scrollbar-width:thin}.category-chip{border:1px solid #e2e8f0;background:#fff;padding:8px 14px;border-radius:999px;font-size:12px;font-weight:800;color:#475569;white-space:nowrap}.category-chip.active,.category-chip:hover{background:#0f172a;color:#fff;border-color:#0f172a}.product-panel{background:#fff;border:1px solid #edf2f7;border-radius:20px;padding:17px;margin-top:10px;box-shadow:0 8px 24px rgba(15,23,42,.05)}.product-panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.product-panel-head h3{margin:0;font-size:18px}.pos-products{grid-template-columns:repeat(auto-fill,minmax(175px,1fr));max-height:calc(100vh - 330px);padding:2px}.product-card{border:1px solid #e2e8f0;background:#fff;border-radius:17px;overflow:hidden;text-align:right;padding:0;min-height:205px;transition:.2s;box-shadow:0 3px 12px rgba(15,23,42,.04)}.product-card:hover{border-color:#3b82f6;transform:translateY(-2px);box-shadow:0 12px 25px rgba(15,23,42,.09)}.product-card img,.product-placeholder{width:100%;height:118px;object-fit:cover;background:linear-gradient(135deg,#e2e8f0,#f8fafc);display:grid;place-items:center;color:#64748b;font-size:28px}.product-card-body{padding:11px}.product-name{font-size:14px;font-weight:900;line-height:1.4;min-height:40px}.product-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:7px}.product-meta span{font-size:10px;color:#64748b}.product-meta b{font-size:17px;color:#2563eb}.product-stock{margin-top:6px;font-size:10px;color:#94a3b8}
.pos-cart-panel{background:#fff;border:1px solid #e5eaf0;border-radius:22px;display:flex;flex-direction:column;position:sticky;top:18px;height:calc(100vh - 130px);min-height:580px;overflow:hidden;box-shadow:0 18px 40px rgba(15,23,42,.08)}.pos-cart-head{padding:17px 18px;border-bottom:1px solid #eef2f6;display:flex;align-items:center;justify-content:space-between}.cart-title{display:flex;align-items:center;gap:10px}.cart-bird{width:42px;height:42px;border-radius:13px;background:#eff6ff;display:grid;place-items:center;font-size:23px}.pos-cart-head h3{margin:0;font-size:17px}.pos-cart-lines{flex:1;overflow:auto;padding:10px 13px}.pos-cart-lines .cart-row{grid-template-columns:1fr auto auto;gap:7px;padding:12px 4px}.pos-cart-lines .cart-row>button{grid-column:3;grid-row:1 / span 2}.pos-cart-lines .cart-row>b{font-size:12px}.pos-cart-lines .qty{grid-column:2;grid-row:1 / span 2}.cart-summary{border-top:1px solid #eef2f6;padding:13px 15px;background:#fbfdff}.summary-line{display:flex;align-items:center;justify-content:space-between;font-size:13px;padding:5px 0}.summary-line.total{margin-top:6px;background:#f1f5f9;border-radius:14px;padding:12px 13px}.summary-line.total strong{font-size:23px;color:#0f172a}.summary-fields{display:grid;grid-template-columns:1fr 1fr;gap:8px}.summary-fields label,.customer-box label{display:grid;gap:5px;font-size:11px;font-weight:800;color:#64748b}.summary-fields .input,.customer-box .input{padding:9px 10px;font-size:12px}.customer-box{padding:12px 15px;display:grid;gap:8px}.pos-cart-actions{padding:0 15px 15px}.pos-cart-actions>.btn{min-height:46px}.action-row{display:flex;gap:8px;margin-top:8px}.action-row .btn{flex:1}.pos-focus{white-space:nowrap}.held{font-size:11px}
@media(max-width:1050px){.pos-shell{grid-template-columns:1fr}.pos-cart-panel{position:static;height:auto;min-height:520px}.pos-products{max-height:52vh}}
@media(max-width:650px){.pos-header-card{flex-wrap:wrap;padding:15px}.pos-branding{min-width:0;flex:1}.pos-search-wrap{order:3;flex-basis:100%}.pos-scanner-card{grid-template-columns:1fr}.scanner-actions{grid-template-columns:1fr}.pos-products{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product-card{min-height:190px}.product-card img,.product-placeholder{height:92px}.pos-cart-panel{border-radius:17px}.pos-cart-lines .cart-row{grid-template-columns:1fr auto auto}.pos-focus{width:100%}}
'''
          s += '\n' + css
          p.write_text(s, encoding='utf-8')

          # 4) Add image field to the product form without changing its existing business flow.
          p = root / 'index.html'
          s = p.read_text(encoding='utf-8')
          if 'id="pImage"' not in s:
              s = s.replace('<input id="pCat" class="input" placeholder="التصنيف: لمبات، كابلات...">', '<input id="pCat" class="input" placeholder="التصنيف: لمبات، كابلات...">\n          <input id="pImage" class="input wide" placeholder="رابط صورة المنتج (اختياري)">')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate JavaScript structure
        run: |
          node --check app.js

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js styles.css
          git diff --cached --quiet || git commit -m 'fix: restore Five Stars POS from Juba reference'
          git push

      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/restore-pos-from-juba.yml
          git commit -m 'chore: remove one-time Five Stars POS restore workflow'
          git push
