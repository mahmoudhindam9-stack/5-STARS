name: Build Five Stars Windows Installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create Windows icon assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path electron | Out-Null
          magick electron/icon.svg -background none -resize 256x256 electron/icon.png
          magick electron/icon.svg -background none -define icon:auto-resize=256,128,64,48,32,16 electron/icon.ico

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify installer outputs
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist-installer -Filter '*SETUP.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Five Stars SETUP.exe was not generated.' }
          $uninstall = Get-ChildItem dist-installer -Filter '*UNINSTALL*' | Select-Object -First 1
          Write-Host "Setup: $($setup.FullName)"
          if ($uninstall) { Write-Host "Uninstall artifact: $($uninstall.FullName)" }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Five-Stars-Windows-Installer
          path: dist-installer/*
          if-no-files-found: error
          retention-days: 30

      # Build is intentionally triggered from authenticated repository pushes.
