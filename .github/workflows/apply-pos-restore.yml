name: Apply Five Stars POS restore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply POS restore
        run: python3 tools/restore_pos_from_juba.py

      - name: Validate JavaScript
        run: node --check app.js

      - name: Commit generated changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js styles.css
          git diff --cached --quiet || git commit -m 'fix: restore Five Stars POS from Juba reference'
          git push
